name: CI

# Runs the NETRA test-suite on every push and pull request. The suite is the
# contract: the pinned requirements.txt is "the combination the tests pass on",
# so CI is what keeps a dependency bump or a refactor from silently breaking a
# deployment target.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and the Docker-pinned version — catches version-specific breakage.
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile (fast import smoke check)
        run: python -m compileall -q app.py src

      - name: Run test suite
        run: python -m pytest -q
