[theme]
base = "dark"
primaryColor = "#00d4ff"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#121826"
textColor = "#e6edf3"
font = "sans serif"

[server]
maxUploadSize = 50
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
